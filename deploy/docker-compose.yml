name: open-design

services:
  open-design:
    container_name: open-design
    image: ${OPEN_DESIGN_IMAGE:-ghcr.io/nexu-io/od:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=192}
      OD_BIND_HOST: 0.0.0.0
      OD_ALLOWED_ORIGINS: ${OPEN_DESIGN_ALLOWED_ORIGINS:-}
      OD_PORT: 7456
      OD_WEB_PORT: ${OPEN_DESIGN_PORT:-7456}
      OD_API_TOKEN: ${OD_API_TOKEN:?Please run 'openssl rand -hex 32' to generate one, and set it in your .env file.}
      OD_CODEX_SANDBOX: ${OD_CODEX_SANDBOX:-}
      # Optional accounts (better-auth). Leave OPEN_DESIGN_DATABASE_URL unset to disable.
      OPEN_DESIGN_DATABASE_URL: ${OPEN_DESIGN_DATABASE_URL:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      # Google OAuth (both required to enable "Continue with Google").
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Signup policy: open | invite | closed.
      OD_AUTH_SIGNUP_MODE: ${OD_AUTH_SIGNUP_MODE:-open}
      # Email-code (OTP) delivery. Without SMTP the code is written to the daemon log.
      OD_AUTH_SMTP_HOST: ${OD_AUTH_SMTP_HOST:-}
      OD_AUTH_SMTP_PORT: ${OD_AUTH_SMTP_PORT:-587}
      OD_AUTH_SMTP_USER: ${OD_AUTH_SMTP_USER:-}
      OD_AUTH_SMTP_PASS: ${OD_AUTH_SMTP_PASS:-}
      OD_AUTH_SMTP_FROM: ${OD_AUTH_SMTP_FROM:-}
    ports:
      - "127.0.0.1:${OPEN_DESIGN_PORT:-7456}:7456"
    volumes:
      - open_design_data:/app/.od
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${OPEN_DESIGN_MEM_LIMIT:-384m}
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  open_design_data:
